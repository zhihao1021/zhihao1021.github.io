# ZhiHao's Blog（Astro 靜態網站）的 nginx 設定
#
# 使用方式：
#   1. pnpm build，將 dist/ 的內容上傳到伺服器的 /var/www/chih-hao.xyz
#   2. 將此檔放到 /etc/nginx/conf.d/chih-hao.xyz.conf（或 sites-available 並建立連結）
#   3. 依實際情況修改憑證路徑，nginx -t 測試後 systemctl reload nginx
#
# 需要 nginx 1.25.1 以上（使用 `http2 on;` 語法）；較舊版本請改成 `listen 443 ssl http2;`。

# ---------- 短網址對照表 ----------
# 建置時產生的 /short-links.map（見 src/utils/shortLinks.ts），格式為「/s/代碼 /articles/...;」。
# map 需位於 http 區塊（放在 conf.d/ 的檔案即屬於 http 區塊）；更新網站後需 nginx -s reload 才會重新讀取。
map $uri $short_link {
    default "";
    include /var/www/chih-hao.xyz/short-links.map;
}

# ---------- HTTP → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name chih-hao.xyz www.chih-hao.xyz;

    # Let's Encrypt（certbot --webroot）驗證用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.chih-hao.xyz$request_uri;
    }
}

# ---------- 裸網域 → www ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chih-hao.xyz;

    ssl_certificate     /etc/letsencrypt/live/chih-hao.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chih-hao.xyz/privkey.pem;

    return 301 https://www.chih-hao.xyz$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.chih-hao.xyz;

    root /var/www/chih-hao.xyz;
    index index.html;
    charset utf-8;

    # ----- TLS -----
    ssl_certificate     /etc/letsencrypt/live/chih-hao.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chih-hao.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ----- 壓縮 -----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/xml application/rss+xml
        application/javascript application/json image/svg+xml font/ttf font/otf;

    # 隱藏 nginx 版本
    server_tokens off;

    # ----- 安全性標頭 -----
    # 注意：nginx 的 add_header 在 location 內一旦出現，就不會繼承 server 層的設定，
    # 因此下方有 add_header 的 location 都會重複寫一次。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ----- 頁面 -----
    # Astro 預設輸出 /articles/foo/index.html，網址則為 /articles/foo（不加結尾斜線）。
    # 依序嘗試檔案本身、目錄下的 index.html，避免 nginx 自動 301 加上斜線。
    location / {
        try_files $uri $uri/index.html $uri.html =404;

        # HTML 每次都向伺服器確認（有 ETag，未變更時只回 304），確保更新文章後立即生效
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 短網址：對照表中有的直接 301 到文章；沒有的交給靜態轉址頁（/s/代碼/index.html）
    location ^~ /s/ {
        if ($short_link) {
            return 301 $short_link;
        }
        try_files $uri $uri/index.html =404;
    }

    # 隱藏檔（.git 等）一律拒絕（正規表示式 location 依出現順序比對，需放在最前面）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 有結尾斜線的網址導向無斜線版本（與 sitemap 及站內連結一致，避免重複內容）
    location ~ ^(.+)/$ {
        if (-f $document_root$1/index.html) {
            return 301 $1;
        }
        try_files $uri $uri/index.html =404;
    }

    # Astro 建置產生的 JS / CSS / 圖片，檔名含 hash，內容不會變動 → 長期快取
    # （^~：命中後不再比對下方的圖片副檔名規則）
    location ^~ /_astro/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # public/ 中的靜態檔（favicon 等），檔名不含 hash → 快取一週
    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # sitemap / robots.txt
    location ~* ^/(?:sitemap-.*\.xml|robots\.txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ----- 404 -----
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
